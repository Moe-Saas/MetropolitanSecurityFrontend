name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  # Heavy work (npm install + build) runs on GitHub's hosted runner,
  # so the EC2 only receives the finished static files.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate build configuration
        env:
          REACT_APP_BASEURL: ${{ vars.REACT_APP_BASEURL }}
          REACT_APP_MediaURL: ${{ vars.REACT_APP_MediaURL }}
        run: |
          test -n "$REACT_APP_BASEURL" || (echo "Missing repository variable REACT_APP_BASEURL" && exit 1)
          test -n "$REACT_APP_MediaURL" || (echo "Missing repository variable REACT_APP_MediaURL" && exit 1)

      - name: Install dependencies
        run: npm install --force

      - name: Build
        env:
          REACT_APP_BASEURL: ${{ vars.REACT_APP_BASEURL }}
          REACT_APP_MediaURL: ${{ vars.REACT_APP_MediaURL }}
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  # The EC2 only downloads the build and restarts PM2 (very light).
  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ${{ runner.temp }}/frontend-build

      - name: Publish build
        env:
          BUILD_DIR: ${{ runner.temp }}/frontend-build
        run: |
          DEPLOY_DIR="$HOME/frontend-deploy"
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete "$BUILD_DIR/" "$DEPLOY_DIR/"

      # pm2.config.js isn't checked out on the EC2, so serve directly.
      - name: Restart with PM2
        run: |
          pm2 delete react-app || true
          pm2 serve "$HOME/frontend-deploy" 3000 --spa --name react-app
          pm2 save --force

      - name: Cleanup
        if: always()
        run: rm -rf "${{ runner.temp }}/frontend-build"
